<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EV Charging Station Finder & Booking</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <h1>⚡ EV Charge Finder</h1>
  <nav>
    <button class="nav-btn active" data-tab="stationsTab">Stations</button>
    <button class="nav-btn" data-tab="bookingsTab">My Bookings</button>
  </nav>
</header>

<main>

  <!-- STATIONS TAB -->
  <section id="stationsTab" class="tab">
    <div class="filters">
      <input type="text" id="searchInput" placeholder="Search by station, city or address..." />
      <select id="cityFilter">
        <option value="">All Cities</option>
      </select>
      <select id="typeFilter">
        <option value="">All Charging Types</option>
      </select>
      <select id="availFilter">
        <option value="">All Availability</option>
        <option value="available">Available Now</option>
        <option value="unavailable">Not Available</option>
      </select>
      <button id="clearFiltersBtn">Clear</button>
    </div>

    <div id="stationList" class="card-grid"></div>
  </section>

  <!-- STATION DETAILS TAB (hidden until a station is clicked) -->
  <section id="detailsTab" class="tab hidden">
    <button class="back-btn" data-back="stationsTab">&larr; Back to stations</button>
    <div id="stationDetailBox" class="detail-box"></div>
  </section>

  <!-- BOOKING FORM TAB -->
  <section id="bookingFormTab" class="tab hidden">
    <button class="back-btn" data-back="detailsTab">&larr; Back to station</button>
    <h2>Book a Charging Slot</h2>
    <p id="bookingStationLabel" class="muted"></p>

    <form id="bookingForm" class="form">
      <input type="hidden" id="bf_stationId" />

      <label>Full Name
        <input type="text" id="bf_userName" required />
      </label>

      <label>Email
        <input type="email" id="bf_userEmail" required />
      </label>

      <label>Phone Number
        <input type="tel" id="bf_userPhone" maxlength="10" placeholder="10 digit mobile number" required />
      </label>

      <label>Vehicle Type
        <select id="bf_vehicleType" required>
          <option value="">Select vehicle type</option>
          <option value="2-Wheeler">2-Wheeler</option>
          <option value="4-Wheeler">4-Wheeler</option>
          <option value="Commercial/Bus">Commercial / Bus</option>
        </select>
      </label>

      <label>Vehicle Number
        <input type="text" id="bf_vehicleNumber" placeholder="e.g. KA19AB1234" required />
      </label>

      <label>Date
        <input type="date" id="bf_bookingDate" required />
      </label>

      <label>Time
        <input type="time" id="bf_bookingTime" required />
      </label>

      <label>Duration
        <select id="bf_durationMinutes">
          <option value="30">30 minutes</option>
          <option value="60" selected>60 minutes</option>
          <option value="90">90 minutes</option>
          <option value="120">120 minutes</option>
        </select>
      </label>

      <div id="bookingFormErrors" class="error-box hidden"></div>
      <div id="bookingFormSuccess" class="success-box hidden"></div>

      <button type="submit">Confirm Booking</button>
    </form>
  </section>

  <!-- MY BOOKINGS TAB -->
  <section id="bookingsTab" class="tab hidden">
    <h2>My Bookings</h2>
    <div class="filters">
      <input type="email" id="myEmailInput" placeholder="Enter your email to view your bookings" />
      <button id="loadBookingsBtn">Load Bookings</button>
    </div>
    <div id="bookingList" class="card-grid"></div>
  </section>

  <!-- BOOKING DETAILS / EDIT TAB -->
  <section id="bookingDetailTab" class="tab hidden">
    <button class="back-btn" data-back="bookingsTab">&larr; Back to my bookings</button>
    <div id="bookingDetailBox" class="detail-box"></div>
  </section>

</main>

<footer>
  <p>EV Charging Station Finder & Booking — demo project</p>
</footer>

<script src="app.js"></script>
</body>
</html>
